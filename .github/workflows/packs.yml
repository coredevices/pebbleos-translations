name: Language packs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild all packs (unchanged content keeps its version)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: language-packs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y gettext libfreetype6
      - run: uv sync --locked
      - run: uv run --locked python tools/publish_packs.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: language-packs-preview
          path: dist/release/

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y gettext libfreetype6
      - run: uv sync --locked
      - run: PYTHONPATH=tools uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked ruff check tools tests
      - run: uv run --locked ruff format --check tools tests
      - name: Build, verify and publish complete snapshot
        run: |
          args=()
          if [ "$REBUILD" = true ]; then args+=(--rebuild); fi
          uv run --locked python tools/publish_packs.py --publish "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
