[project]
name = "pebbleos-translations"
version = "0.1.0"
description = "Catalog maintenance and universal Pebble language-pack tools"
requires-python = ">=3.9"
dependencies = [
    "freetype-py==2.5.1",
    "polib==1.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
pebble-lang = "pebble_language_tools.lang:main"

[tool.setuptools]
packages = ["pebble_language_tools", "pebble_language_tools.data"]
package-dir = {pebble_language_tools = "tools", "pebble_language_tools.data" = "data"}

[tool.setuptools.package-data]
"pebble_language_tools.data" = ["*.json", "*.txt", "*.md"]
